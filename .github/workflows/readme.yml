name: README

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: '0'
      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 27.0.1+0
          check-latest: true
      - name: Cache scala dependencies
        uses: coursier/cache-action@v9
      - name: Generate README
        run: ./sbt docs/generateReadme
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/update-readme
          base: main
          commit-message: "(docs): Update README"
          title: "(docs): Update README"
          body: Regenerates `README.md` from `modules/docs/readme/README.md` with the latest released version.
          add-paths: README.md
          delete-branch: true
